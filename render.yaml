# Render Deployment Configuration for PITAYA Backend
services:
  - type: web
    name: pitaya-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.9.0
